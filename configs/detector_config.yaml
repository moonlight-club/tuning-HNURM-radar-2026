# 路径使用相对于项目根目录的相对路径，代码会自动解析为绝对路径
path:
  stage_one_path:  "weights/stage_one.pt"
  stage_two_path: "weights/stage_two.pt"
  stage_three_path: "weights/stage_three.pt"
  tracker_path: "configs/bytetrack.yaml"

params:
  labels: ["B1", "B2", "B3", "B4", "B5", "B7", "R1", "R2", "R3", "R4", "R5", "R7"]
  stage_one_conf: 0.1
  stage_two_conf: 0.6
  stage_three_conf: 0.5
  life_time: 90 # 生命周期

# 坐标卡尔曼滤波器参数
# ---[修改前]---
# filter:
#   process_noise: 0.005         # 过程噪声系数（越小越平滑，响应越慢）
#   measurement_noise: 0.15      # 观测噪声系数（越大越信赖预测值）
#   jump_threshold: 1.0          # 单帧跳变阈值 (m)，超过则拒绝更新
#   max_velocity: 5.0            # 最大移动速度 (m/s)，超过则拒绝观测
#   max_inactive_time: 3.0       # 滤波器超时清理时间 (s)

# --- [修改后] ---
filter:
  # // tunning: ★ 彻底逆转 Q/R 信任链，强制消除 1m 相位滞后
  process_noise: 0.1           # [原 0.005] 过程噪声 Q。调大此值，告诉滤波器 RM 机器人具备极高动态的变速/变向能力，不要过度相信运动学预测。
  measurement_noise: 0.02      # [原 0.15] 观测噪声 R。调小此值，强制系统在有检测框时，极度信任 YOLO 透视变换后的物理坐标。
  jump_threshold: 1.5          # [原 1.0] 单帧跳变阈值 (m)。适当放宽，防止低帧率下机器人的合法大位移被当成“瞬移噪音”而拒绝更新。
  max_velocity: 6.0            # [原 5.0] 最大移动速度 (m/s)。RM 步兵/英雄在全功率加速时可达 4~5m/s，放宽至 6.0m/s 防止高速移动时坐标卡死。
  max_inactive_time: 3.0       # [原 3.0] 滤波器超时清理时间 (s)。保持不变，与追踪器的 max_miss 兜底逻辑对齐。

# 匈牙利匹配tracker参数
track:
  iou_thr: 0.05                # IoU 门控下限
  dist_thr: 120                # 中心距离门控（像素）
  lost_thr: 3                  # 漏检1~3帧(0~0.1s)：防闪烁，维持像素短时预测并锁死物理速度
  guess_thr: 18                # tunning: 进入 GUESSING 的阈值略上调，降低过早盲猜
  max_miss: 54                 # 漏检>54帧(>1.8s)：盲猜滑行至1.8s后彻底清除目标内存
  decay_factor: 0.94           # tunning: 增大速度衰减（更快减速，抑制飞点）
  max_guess_sec: 1.3           # tunning: 盲猜最长持续时间下调到 1.3s
  publish_predict_when_no_det: true  # 无检测时是否发布预测/历史位置
  
is_record: true
record_fps: 60